name: Sync interview answers

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull ntfy and write answers/state.json
        env:
          NTFY_TOPIC: karta-sebya-d10-7e4b9c2a1f
          GIST_ID: 6875b75882f26e43380a56279b63fb3d
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, datetime, pathlib, subprocess, base64

          topic = os.environ["NTFY_TOPIC"]
          url = f"https://ntfy.sh/{topic}/json?poll=1"
          req = urllib.request.Request(url, headers={"User-Agent": "karta-sebya-sync"})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode("utf-8", "replace")

          best = None
          best_ts = ""
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  msg = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if msg.get("event") not in (None, "message"):
                  continue
              payload = msg.get("message")
              data = None
              if isinstance(payload, str):
                  try:
                      data = json.loads(payload)
                  except json.JSONDecodeError:
                      data = None
              att = (msg.get("attachment") or {}).get("url")
              if data is None and att:
                  with urllib.request.urlopen(att, timeout=30) as ar:
                      data = json.loads(ar.read().decode("utf-8", "replace"))
              if not isinstance(data, dict):
                  continue
              state = data.get("state") if "state" in data else data
              if not isinstance(state, dict) or "answers" not in state:
                  continue
              ts = str(state.get("updatedAt") or data.get("savedAt") or "")
              if ts >= best_ts:
                  best_ts = ts
                  best = {"type": "karta-state", "savedAt": ts, "state": state}

          if best is None:
              print("no answers yet")
              raise SystemExit(0)

          path = pathlib.Path("answers/state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          new = json.dumps(best, ensure_ascii=False, indent=2) + "\n"
          old = path.read_text(encoding="utf-8") if path.exists() else ""
          if old.strip() == new.strip():
              print("unchanged")
              raise SystemExit(0)
          path.write_text(new, encoding="utf-8")
          print("wrote answers/state.json")

          gist_token = os.environ.get("GIST_TOKEN", "").strip()
          gist_id = os.environ.get("GIST_ID", "").strip()
          if gist_token and gist_id:
              body = json.dumps({"files": {"state.json": {"content": new}}}).encode()
              greq = urllib.request.Request(
                  f"https://api.github.com/gists/{gist_id}",
                  data=body,
                  method="PATCH",
                  headers={
                      "Authorization": f"Bearer {gist_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "karta-sebya-sync",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(greq, timeout=30) as gr:
                  print("gist", gr.status)
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add answers/state.json
          git diff --cached --quiet || git commit -m "Sync interview answers from cloud"
          git pull --rebase || true
          git push
